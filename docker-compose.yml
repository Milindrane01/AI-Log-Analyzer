# Local development environment. Usage:
#   cp backend/.env.example backend/.env   (edit values)
#   docker compose up --build
# API:      http://localhost:8000/api/v1/health
# Swagger:  http://localhost:8000/docs
#
# postgres/redis are provisioned now but the app connects to them starting
# in Milestone 2/3 — having them up early keeps every dev environment identical.

services:
  api:
    build:
      context: ./backend
      dockerfile: ../infra/docker/api.Dockerfile
    ports:
      - "8000:8000"
    env_file: ./backend/.env
    environment:
      APP_LOG_JSON: "false"   # pretty logs for local dev
      APP_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-loganalyzer}:${POSTGRES_PASSWORD:?set in backend/.env}@postgres:5432/${POSTGRES_DB:-loganalyzer}
      APP_REDIS_URL: redis://redis:6379/0
      APP_UPLOAD_DIR: /srv/uploads
    volumes:
      - uploads:/srv/uploads   # shared with worker: api writes files, worker reads them
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    develop:
      watch:                   # `docker compose watch` → live-sync code changes
        - action: sync+restart
          path: ./backend/app
          target: /srv/app

  worker:
    build:
      context: ./backend
      dockerfile: ../infra/docker/api.Dockerfile
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=INFO"]
    # Own healthcheck: the worker runs Celery, not the API's web server, so the
    # image's default HTTP healthcheck would always report "unhealthy". Ping the
    # running Celery worker instead.
    healthcheck:
      test: ["CMD", "celery", "-A", "app.workers.celery_app", "inspect", "ping", "-d", "celery@$${HOSTNAME}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    env_file: ./backend/.env
    environment:
      APP_LOG_JSON: "false"
      APP_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-loganalyzer}:${POSTGRES_PASSWORD:?set in backend/.env}@postgres:5432/${POSTGRES_DB:-loganalyzer}
      APP_REDIS_URL: redis://redis:6379/0
      APP_UPLOAD_DIR: /srv/uploads
    volumes:
      - uploads:/srv/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infra/docker/frontend.Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loganalyzer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in backend/.env}
      POSTGRES_DB: ${POSTGRES_DB:-loganalyzer}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-loganalyzer}"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.10.1
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    depends_on:
      - prometheus

volumes:
  pgdata:
  uploads:
  qdrant_data:
