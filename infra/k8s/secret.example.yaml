# COPY to secret.yaml, fill real values, and NEVER commit secret.yaml (.gitignored).
# In real clusters use a sealed-secrets / external-secrets operator instead of raw Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: log-analyzer
type: Opaque
stringData:
  APP_JWT_SECRET_KEY: "CHANGE-ME-to-a-long-random-string"
  APP_DATABASE_URL: "postgresql+asyncpg://loganalyzer:CHANGE-ME@postgres:5432/loganalyzer"
  APP_OPENAI_API_KEY: ""   # optional; empty disables AI features
  POSTGRES_PASSWORD: "CHANGE-ME"
