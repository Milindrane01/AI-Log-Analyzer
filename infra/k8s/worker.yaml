apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: log-analyzer
spec:
  replicas: 2
  selector:
    matchLabels: { app: worker }
  template:
    metadata:
      labels: { app: worker }
    spec:
      containers:
        - name: worker
          image: log-analyzer-api:latest   # same image, different command
          command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=INFO"]
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef: { name: app-secrets }
          resources:
            requests: { cpu: "200m", memory: "512Mi" }
            limits: { cpu: "1000m", memory: "1Gi" }   # AI + embeddings are the heavy path
