server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: unknown paths fall back to index.html (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API: browser talks to nginx, nginx proxies to the api service.
    # This is why the app needs NO CORS configuration anywhere.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 60m;   # must exceed the 50MB upload cap
    }

    gzip on;
    gzip_types text/css application/javascript application/json;
}
